<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog — Takey Tahmid</title>
  <link rel="preconnect" href="https://api.fontshare.com" />
  <link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&f[]=cabinet-grotesk@300,400,500,700,800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0A0A0A; --bg2: #111111; --bg3: #1A1A1A; --card: #141414;
      --accent: #E8622A; --accent2: #FF7A42;
      --cream: #F5F0E8; --text: #EDEDED; --muted: #888888; --border: rgba(255,255,255,0.07);
      --fd: 'Clash Display', sans-serif; --fb: 'Cabinet Grotesk', sans-serif;
    }
    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--text); font-family: var(--fb); overflow-x: hidden; }

    nav {
      position: fixed; top:0; left:0; right:0; z-index:200;
      display:flex; align-items:center; justify-content:space-between;
      padding:1.4rem 5rem;
      background:rgba(10,10,10,0.9); backdrop-filter:blur(20px);
      border-bottom:1px solid var(--border);
    }
    .nav-logo { font-family:var(--fd); font-weight:700; font-size:1.1rem; color:var(--cream); text-decoration:none; }
    .nav-logo span { color:var(--accent); }
    .nav-links { display:flex; gap:2.5rem; list-style:none; }
    .nav-links a { color:var(--muted); text-decoration:none; font-size:0.88rem; font-weight:500; transition:color 0.2s; }
    .nav-links a:hover, .nav-links a.active { color:var(--text); }
    .nav-cta { background:var(--accent) !important; color:#fff !important; padding:0.5rem 1.4rem !important; border-radius:100px !important; }

    /* ── LIST VIEW ── */
    #listView { display: block; }
    #postView { display: none; }

    .page-header {
      padding: 9rem 5rem 4rem;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      position: relative; overflow: hidden;
    }

    .page-header::after {
      content: 'BLOG';
      position: absolute; right: -0.05em; bottom: -0.1em;
      font-family: var(--fd); font-size: clamp(8rem,18vw,22rem); font-weight:700;
      color: transparent; -webkit-text-stroke: 1px rgba(255,255,255,0.04);
      line-height:1; pointer-events:none;
    }

    .section-label {
      display:inline-flex; align-items:center; gap:0.6rem;
      font-size:0.75rem; font-weight:600; letter-spacing:0.14em;
      text-transform:uppercase; color:var(--accent); margin-bottom:1.2rem;
    }
    .section-label::before { content:''; width:20px; height:2px; background:var(--accent); }

    h1 {
      font-family:var(--fd); font-size:clamp(2.5rem,5vw,4.5rem);
      font-weight:700; letter-spacing:-0.03em; color:var(--cream);
      line-height:1.05; position:relative; z-index:1;
    }

    /* FILTER TABS */
    .filter-bar {
      padding: 2rem 5rem;
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }

    .filter-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 0.45rem 1.1rem;
      border-radius: 100px;
      font-family: var(--fb);
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn:hover, .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* BLOG GRID */
    .blog-list {
      padding: 4rem 5rem 8rem;
    }

    .blog-grid-main {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.8rem;
    }

    .blog-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      transition: border-color 0.3s, transform 0.3s;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .blog-card:hover {
      border-color: rgba(232,98,42,0.3);
      transform: translateY(-5px);
    }

    .blog-thumb {
      width: 100%; aspect-ratio: 16/9;
      object-fit: cover; background: var(--bg3);
      display: block;
    }

    .blog-body { padding: 1.8rem; }

    .blog-meta { display:flex; align-items:center; gap:0.8rem; margin-bottom:1rem; }

    .blog-cat {
      font-size:0.7rem; font-weight:700; letter-spacing:0.1em;
      text-transform:uppercase; color:var(--accent);
      background:rgba(232,98,42,0.1); padding:0.25rem 0.7rem; border-radius:100px;
    }

    .blog-read { font-size:0.75rem; color:var(--muted); }

    .blog-title {
      font-family:var(--fd); font-size:1.1rem; font-weight:600;
      color:var(--cream); line-height:1.3; letter-spacing:-0.01em; margin-bottom:0.7rem;
    }

    .blog-excerpt { font-size:0.85rem; color:var(--muted); line-height:1.6; }
    .blog-date { display:block; font-size:0.75rem; color:var(--muted); margin-top:1.2rem; }

    #blog-loading {
      text-align:center; padding:5rem; color:var(--muted); font-size:0.9rem;
    }

    .no-posts {
      grid-column: span 3;
      text-align: center;
      padding: 4rem;
      color: var(--muted);
    }

    /* ── SINGLE POST VIEW ── */
    .post-back {
      display: inline-flex; align-items:center; gap:0.5rem;
      color: var(--muted); font-size:0.85rem; font-weight:500;
      text-decoration:none; cursor:pointer; background:none; border:none;
      padding: 0; transition: color 0.2s;
    }
    .post-back:hover { color: var(--accent); }

    .post-header {
      padding: 9rem 5rem 4rem;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
    }

    .post-header-inner { max-width: 800px; }

    .post-cat-date {
      display: flex; align-items:center; gap:1rem; margin-bottom:1.5rem;
    }

    .post-h1 {
      font-family: var(--fd);
      font-size: clamp(2rem, 4.5vw, 3.8rem);
      font-weight: 700; letter-spacing:-0.03em;
      color: var(--cream); line-height:1.08; margin-bottom:1.2rem;
    }

    .post-excerpt {
      font-size: 1.05rem; color: var(--muted);
      line-height: 1.75; font-weight: 400; max-width: 680px;
    }

    .post-cover {
      width: 100%; max-height: 480px;
      object-fit: cover;
      display: block;
    }

    .post-body {
      max-width: 780px;
      margin: 0 auto;
      padding: 5rem 2rem 8rem;
    }

    .post-content p {
      font-size: 1rem;
      color: #C8C8C8;
      line-height: 1.85;
      margin-bottom: 1.6rem;
      font-weight: 400;
    }

    /* FOOTER */
    footer {
      background:var(--bg2); border-top:1px solid var(--border);
      padding:2.5rem 5rem;
      display:flex; align-items:center; justify-content:space-between;
    }
    .footer-logo { font-family:var(--fd); font-size:1rem; font-weight:700; color:var(--cream); text-decoration:none; }
    .footer-logo span { color:var(--accent); }
    .footer-nav { display:flex; gap:2rem; list-style:none; }
    .footer-nav a { color:var(--muted); text-decoration:none; font-size:0.85rem; transition:color 0.2s; }
    .footer-nav a:hover { color:var(--text); }
    .footer-copy { font-size:0.8rem; color:var(--muted); }

    @media (max-width: 960px) {
      nav { padding:1rem 1.5rem; }
      .nav-links { display:none; }
      .page-header { padding:7rem 1.5rem 3rem; }
      .page-header::after { display:none; }
      .filter-bar { padding:1.5rem; }
      .blog-list { padding:3rem 1.5rem 5rem; }
      .blog-grid-main { grid-template-columns:1fr; }
      .no-posts { grid-column: span 1; }
      .post-header { padding:7rem 1.5rem 3rem; }
      .post-body { padding:3rem 1.5rem 5rem; }
      footer { flex-direction:column; gap:1.2rem; text-align:center; padding:2rem 1.5rem; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="nav-logo">Takey<span>.</span></a>
    <ul class="nav-links">
      <li><a href="index.html">About</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="blog.html" class="active">Blog</a></li>
      <li><a href="contact.html" class="nav-cta">Work With Me</a></li>
    </ul>
  </nav>

  <!-- LIST VIEW -->
  <div id="listView">
    <div class="page-header">
      <div class="section-label">Writing</div>
      <h1>Blog & Insights</h1>
    </div>

    <div class="filter-bar" id="filterBar">
      <button class="filter-btn active" data-cat="all">All</button>
    </div>

    <div class="blog-list">
      <div id="blog-loading">Loading posts...</div>
      <div class="blog-grid-main" id="blogGrid" style="display:none;"></div>
    </div>
  </div>

  <!-- SINGLE POST VIEW -->
  <div id="postView">
    <div class="post-header">
      <div class="post-header-inner">
        <button class="post-back" onclick="showList()">← Back to Blog</button>
        <div class="post-cat-date" id="postMeta" style="margin-top:1.5rem;"></div>
        <h1 class="post-h1" id="postTitle"></h1>
        <p class="post-excerpt" id="postExcerpt"></p>
      </div>
    </div>
    <img class="post-cover" id="postCover" src="" alt="" />
    <div class="post-body">
      <div class="post-content" id="postContent"></div>
    </div>
  </div>

  <footer>
    <a href="index.html" class="footer-logo">Takey<span>.</span></a>
    <ul class="footer-nav">
      <li><a href="index.html">About</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="blog.html">Blog</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
    <div class="footer-copy">© 2026 Takey Tahmid</div>
  </footer>

  <script>
    let allPosts = [];
    let activeFilter = 'all';

    function formatDate(d) {
      return new Date(d).toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' });
    }

    function renderCards(posts) {
      const grid = document.getElementById('blogGrid');
      if (!posts.length) {
        grid.innerHTML = '<div class="no-posts">No posts in this category yet.</div>';
        grid.style.display = 'grid';
        return;
      }
      grid.innerHTML = posts.map(p => `
        <div class="blog-card" onclick="showPost('${p.slug}')">
          <img class="blog-thumb" src="${p.cover}" alt="${p.title}" loading="lazy" onerror="this.style.display='none'" />
          <div class="blog-body">
            <div class="blog-meta">
              <span class="blog-cat">${p.category}</span>
              <span class="blog-read">${p.readTime}</span>
            </div>
            <div class="blog-title">${p.title}</div>
            <div class="blog-excerpt">${p.excerpt}</div>
            <span class="blog-date">${formatDate(p.date)}</span>
          </div>
        </div>
      `).join('');
      grid.style.display = 'grid';
    }

    function buildFilters(posts) {
      const cats = [...new Set(posts.map(p => p.category))];
      const bar = document.getElementById('filterBar');
      cats.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn';
        btn.dataset.cat = cat;
        btn.textContent = cat;
        btn.onclick = () => {
          activeFilter = cat;
          document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          const filtered = allPosts.filter(p => p.category === cat);
          renderCards(filtered);
        };
        bar.appendChild(btn);
      });

      bar.querySelector('[data-cat="all"]').onclick = () => {
        activeFilter = 'all';
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        bar.querySelector('[data-cat="all"]').classList.add('active');
        renderCards(allPosts);
      };
    }

    function showPost(slug) {
      const post = allPosts.find(p => p.slug === slug);
      if (!post) return;

      document.getElementById('postTitle').textContent = post.title;
      document.getElementById('postExcerpt').textContent = post.excerpt;
      document.getElementById('postCover').src = post.cover;
      document.getElementById('postCover').alt = post.title;
      document.getElementById('postMeta').innerHTML = `
        <span class="blog-cat">${post.category}</span>
        <span class="blog-read">${post.readTime}</span>
        <span class="blog-read">${formatDate(post.date)}</span>
      `;

      // Render paragraphs
      const paras = post.content.split('\n\n').map(p => `<p>${p}</p>`).join('');
      document.getElementById('postContent').innerHTML = paras;

      document.getElementById('listView').style.display = 'none';
      document.getElementById('postView').style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });

      // Update URL without reload
      history.pushState({}, '', `blog.html?post=${slug}`);
    }

    function showList() {
      document.getElementById('listView').style.display = 'block';
      document.getElementById('postView').style.display = 'none';
      history.pushState({}, '', 'blog.html');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function loadBlogs() {
      try {
        const res = await fetch('blogs.json');
        allPosts = await res.json();
        buildFilters(allPosts);
        renderCards(allPosts);
        document.getElementById('blog-loading').style.display = 'none';

        // Check if URL has ?post= param
        const params = new URLSearchParams(window.location.search);
        const slug = params.get('post');
        if (slug) showPost(slug);

      } catch {
        document.getElementById('blog-loading').textContent = 'Could not load posts. Make sure blogs.json is in your repo.';
      }
    }

    loadBlogs();
  </script>
</body>
</html>
