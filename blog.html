<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog — Takey Tahmid | Meta Ads & Digital Marketing Insights</title>
  <meta name="description" content="Practical posts on Meta Ads, CAPI tracking, campaign optimisation, and digital marketing strategy by Takey Tahmid." />
  <meta property="og:title" content="Blog — Takey Tahmid" />
  <meta property="og:description" content="Practical posts on Meta Ads, CAPI tracking, and campaign optimisation." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://takey-tahmid.netlify.app/blog" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Blog — Takey Tahmid" />
  <meta name="twitter:description" content="Practical posts on Meta Ads, CAPI tracking, and campaign optimisation." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,700&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#0A0A0A;--bg2:#111111;--bg3:#1A1A1A;--card:#141414;--accent:#E8622A;--accent2:#FF7A42;--cream:#F5F0E8;--text:#EDEDED;--muted:#888888;--border:rgba(255,255,255,0.08);--fh:'Bebas Neue',sans-serif;--fb:'DM Sans',sans-serif}
    html{scroll-behavior:smooth}
    body{background:var(--bg);color:var(--text);font-family:var(--fb);overflow-x:hidden}
    nav{position:fixed;top:0;left:0;right:0;z-index:200;display:flex;align-items:center;justify-content:space-between;padding:1.2rem 5rem;background:rgba(10,10,10,0.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
    .nav-logo{font-family:var(--fh);font-size:1.6rem;color:var(--cream);text-decoration:none;letter-spacing:0.05em}
    .nav-logo span{color:var(--accent)}
    .nav-links{display:flex;gap:2.5rem;list-style:none;align-items:center}
    .nav-links a{color:var(--muted);text-decoration:none;font-size:0.88rem;font-weight:500;transition:color 0.2s}
    .nav-links a:hover,.nav-links a.active{color:var(--text)}
    .nav-cta{background:var(--accent)!important;color:#fff!important;padding:0.55rem 1.5rem!important;border-radius:100px!important;font-weight:600!important}
    /* HAMBURGER */
    .hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:4px;background:none;border:none;z-index:300}
    .hamburger span{display:block;width:24px;height:2px;background:var(--cream);border-radius:2px;transition:all 0.3s}
    .hamburger.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
    .hamburger.open span:nth-child(2){opacity:0}
    .hamburger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
    .mobile-menu{display:none;position:fixed;inset:0;background:rgba(10,10,10,0.98);z-index:250;flex-direction:column;align-items:center;justify-content:center;gap:2.5rem;backdrop-filter:blur(20px)}
    .mobile-menu.open{display:flex}
    .mobile-menu a{font-family:var(--fh);font-size:clamp(2rem,8vw,3.5rem);letter-spacing:0.05em;color:var(--cream);text-decoration:none;transition:color 0.2s}
    .mobile-menu a:hover{color:var(--accent)}
    .mobile-menu .mob-cta{background:var(--accent);color:#fff!important;padding:0.7rem 2.2rem;border-radius:100px}
    #listView{display:block}
    #postView{display:none}
    .page-header{padding:9rem 5rem 5rem;background:var(--bg2);border-bottom:1px solid var(--border);position:relative;overflow:hidden}
    .page-header::after{content:'BLOG';position:absolute;right:-0.05em;bottom:-0.1em;font-family:var(--fh);font-size:clamp(8rem,20vw,26rem);color:transparent;-webkit-text-stroke:1px rgba(255,255,255,0.04);line-height:1;pointer-events:none}
    .section-label{display:inline-flex;align-items:center;gap:0.6rem;font-size:0.75rem;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--accent);margin-bottom:1rem}
    .section-label::before{content:'✦';font-size:0.6rem}
    h1{font-family:var(--fh);font-size:clamp(3rem,7vw,6.5rem);letter-spacing:0.02em;color:var(--cream);line-height:0.95;position:relative;z-index:1}
    .filter-bar{padding:1.5rem 5rem;display:flex;gap:0.6rem;flex-wrap:wrap;border-bottom:1px solid var(--border);background:var(--bg)}
    .filter-btn{background:transparent;border:1px solid var(--border);color:var(--muted);padding:0.45rem 1.1rem;border-radius:100px;font-family:var(--fb);font-size:0.8rem;font-weight:500;cursor:pointer;transition:all 0.2s}
    .filter-btn:hover,.filter-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
    .blog-list{padding:4rem 5rem 8rem}
    .blog-grid-main{display:grid;grid-template-columns:repeat(3,1fr);gap:1.8rem}
    .blog-card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;transition:border-color 0.3s,transform 0.3s;cursor:pointer;text-decoration:none;color:inherit;display:block}
    .blog-card:hover{border-color:rgba(232,98,42,0.3);transform:translateY(-5px)}
    .blog-thumb{width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--bg3);display:block}
    .blog-body{padding:1.8rem}
    .blog-meta{display:flex;align-items:center;gap:0.8rem;margin-bottom:0.9rem}
    .blog-cat{font-size:0.68rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--accent);background:rgba(232,98,42,0.1);padding:0.2rem 0.7rem;border-radius:100px}
    .blog-read{font-size:0.75rem;color:var(--muted)}
    .blog-title{font-family:var(--fh);font-size:1.3rem;letter-spacing:0.02em;color:var(--cream);line-height:1.15;margin-bottom:0.6rem}
    .blog-excerpt{font-size:0.84rem;color:var(--muted);line-height:1.6;font-weight:300}
    .blog-date{display:block;font-size:0.72rem;color:var(--muted);margin-top:1rem}
    #blog-loading{text-align:center;padding:5rem;color:var(--muted)}
    .no-posts{grid-column:span 3;text-align:center;padding:4rem;color:var(--muted)}
    .post-back{display:inline-flex;align-items:center;gap:0.5rem;color:var(--muted);font-size:0.85rem;font-weight:500;text-decoration:none;cursor:pointer;background:none;border:none;padding:0;transition:color 0.2s}
    .post-back:hover{color:var(--accent)}
    .post-header{padding:9rem 5rem 4rem;background:var(--bg2);border-bottom:1px solid var(--border)}
    .post-header-inner{max-width:820px}
    .post-cat-date{display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem}
    .post-h1{font-family:var(--fh);font-size:clamp(2.5rem,6vw,5.5rem);letter-spacing:0.02em;color:var(--cream);line-height:0.95;margin-bottom:1.2rem}
    .post-excerpt{font-size:1rem;color:var(--muted);line-height:1.75;font-weight:300;max-width:680px}
    .post-cover{width:100%;max-height:480px;object-fit:cover;display:block}
    .post-body{max-width:780px;margin:0 auto;padding:5rem 2rem 8rem}
    .post-content p{font-size:1rem;color:#C8C8C8;line-height:1.85;margin-bottom:1.6rem;font-weight:300}
    footer{background:var(--bg2);border-top:1px solid var(--border);padding:2.5rem 5rem;display:flex;align-items:center;justify-content:space-between}
    .footer-logo{font-family:var(--fh);font-size:1.4rem;letter-spacing:0.05em;color:var(--cream);text-decoration:none}
    .footer-logo span{color:var(--accent)}
    .footer-nav{display:flex;gap:2rem;list-style:none}
    .footer-nav a{color:var(--muted);text-decoration:none;font-size:0.85rem;transition:color 0.2s}
    .footer-nav a:hover{color:var(--text)}
    .footer-copy{font-size:0.8rem;color:var(--muted)}
    @media(max-width:960px){
      nav{padding:1rem 1.5rem}
      .hamburger{display:flex}
      .nav-links{display:none!important}
      .page-header{padding:7rem 1.5rem 3rem}
      .page-header::after{display:none}
      .filter-bar{padding:1.5rem}
      .blog-list{padding:3rem 1.5rem 5rem}
      .blog-grid-main{grid-template-columns:1fr}
      .no-posts{grid-column:span 1}
      .post-header{padding:7rem 1.5rem 3rem}
      .post-body{padding:3rem 1.5rem 5rem}
      footer{flex-direction:column;gap:1.2rem;text-align:center;padding:2rem 1.5rem}
    }
  </style>
</head>
<body>
  <nav>
    <a href="index.html" class="nav-logo">TAKEY<span>.</span></a>
    <ul class="nav-links">
      <li><a href="index.html">About</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="blog.html" class="active">Blog</a></li>
      <li><a href="contact.html" class="nav-cta">Work With Me</a></li>
    </ul>
    <button class="hamburger" id="hamburger" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <div class="mobile-menu" id="mobileMenu">
    <a href="index.html" onclick="closeMenu()">About</a>
    <a href="services.html" onclick="closeMenu()">Services</a>
    <a href="blog.html" onclick="closeMenu()">Blog</a>
    <a href="contact.html" class="mob-cta" onclick="closeMenu()">Work With Me</a>
  </div>

  <div id="listView">
    <div class="page-header">
      <div class="section-label">Writing</div>
      <h1>BLOG &<br>INSIGHTS</h1>
    </div>
    <div class="filter-bar" id="filterBar">
      <button class="filter-btn active" data-cat="all">All</button>
    </div>
    <div class="blog-list">
      <div id="blog-loading">Loading posts...</div>
      <div class="blog-grid-main" id="blogGrid" style="display:none;"></div>
    </div>
  </div>

  <div id="postView">
    <div class="post-header">
      <div class="post-header-inner">
        <button class="post-back" onclick="showList()">← Back to Blog</button>
        <div class="post-cat-date" id="postMeta" style="margin-top:1.5rem;"></div>
        <h1 class="post-h1" id="postTitle"></h1>
        <p class="post-excerpt" id="postExcerpt"></p>
      </div>
    </div>
    <img class="post-cover" id="postCover" src="" alt="" />
    <div class="post-body"><div class="post-content" id="postContent"></div></div>
  </div>

  <footer>
    <a href="index.html" class="footer-logo">TAKEY<span>.</span></a>
    <ul class="footer-nav">
      <li><a href="index.html">About</a></li><li><a href="services.html">Services</a></li><li><a href="blog.html">Blog</a></li><li><a href="contact.html">Contact</a></li>
    </ul>
    <div class="footer-copy">© 2026 Takey Tahmid</div>
  </footer>

  <script>
    const hamburger=document.getElementById('hamburger');
    const mobileMenu=document.getElementById('mobileMenu');
    function closeMenu(){hamburger.classList.remove('open');mobileMenu.classList.remove('open');document.body.style.overflow='';}
    hamburger.addEventListener('click',()=>{
      hamburger.classList.toggle('open');
      mobileMenu.classList.toggle('open');
      document.body.style.overflow=mobileMenu.classList.contains('open')?'hidden':'';
    });

    let allPosts=[];
    function formatDate(d){return new Date(d).toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'})}
    function renderCards(posts){
      const grid=document.getElementById('blogGrid');
      if(!posts.length){grid.innerHTML='<div class="no-posts">No posts in this category yet.</div>';grid.style.display='grid';return}
      grid.innerHTML=posts.map(p=>`
        <div class="blog-card" onclick="showPost('${p.slug}')">
          <img class="blog-thumb" src="${p.cover}" alt="${p.title}" loading="lazy" onerror="this.style.display='none'" />
          <div class="blog-body">
            <div class="blog-meta"><span class="blog-cat">${p.category}</span><span class="blog-read">${p.readTime}</span></div>
            <div class="blog-title">${p.title}</div>
            <div class="blog-excerpt">${p.excerpt}</div>
            <span class="blog-date">${formatDate(p.date)}</span>
          </div>
        </div>`).join('');
      grid.style.display='grid';
    }
    function buildFilters(posts){
      const cats=[...new Set(posts.map(p=>p.category))];
      const bar=document.getElementById('filterBar');
      const allBtn=bar.querySelector('[data-cat="all"]');
      allBtn.onclick=()=>{document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));allBtn.classList.add('active');renderCards(allPosts)};
      cats.forEach(cat=>{
        const btn=document.createElement('button');btn.className='filter-btn';btn.dataset.cat=cat;btn.textContent=cat;
        btn.onclick=()=>{document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderCards(allPosts.filter(p=>p.category===cat))};
        bar.appendChild(btn);
      });
    }
    function showPost(slug){
      const post=allPosts.find(p=>p.slug===slug);if(!post)return;
      document.getElementById('postTitle').textContent=post.title;
      document.getElementById('postExcerpt').textContent=post.excerpt;
      document.getElementById('postCover').src=post.cover;
      document.getElementById('postCover').alt=post.title;
      document.getElementById('postMeta').innerHTML=`<span class="blog-cat">${post.category}</span><span class="blog-read">${post.readTime}</span><span class="blog-read">${formatDate(post.date)}</span>`;
      document.getElementById('postContent').innerHTML=post.content.split('\n\n').map(p=>`<p>${p}</p>`).join('');
      document.getElementById('listView').style.display='none';
      document.getElementById('postView').style.display='block';
      window.scrollTo({top:0,behavior:'smooth'});
      history.pushState({},'',`blog.html?post=${slug}`);
      document.title=`${post.title} — Takey Tahmid`;
      document.querySelector('meta[name="description"]').setAttribute('content', post.excerpt);
      document.querySelector('meta[property="og:title"]').setAttribute('content', `${post.title} — Takey Tahmid`);
      document.querySelector('meta[property="og:description"]').setAttribute('content', post.excerpt);
    }
    function showList(){
      document.getElementById('listView').style.display='block';
      document.getElementById('postView').style.display='none';
      history.pushState({},'','blog.html');
      document.title='Blog — Takey Tahmid';
      document.querySelector('meta[name="description"]').setAttribute('content', 'Practical posts on Meta Ads, CAPI tracking, campaign optimisation, and digital marketing strategy by Takey Tahmid.');
      window.scrollTo({top:0,behavior:'smooth'});
    }
    async function loadBlogs(){
      try{
        const res=await fetch('blogs.json');allPosts=await res.json();
        buildFilters(allPosts);renderCards(allPosts);
        document.getElementById('blog-loading').style.display='none';
        const slug=new URLSearchParams(window.location.search).get('post');
        if(slug)showPost(slug);
      }catch{document.getElementById('blog-loading').textContent='Could not load posts. Make sure blogs.json is in your repo.';}
    }
    loadBlogs();
  </script>
</body>
</html>
