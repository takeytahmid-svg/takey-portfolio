<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Message Received — Takey Tahmid</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,700&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#0A0A0A;--bg2:#111111;--bg3:#1A1A1A;--accent:#E8622A;--accent2:#FF7A42;--cream:#F5F0E8;--text:#EDEDED;--muted:#888888;--border:rgba(255,255,255,0.08);--fh:'Bebas Neue',sans-serif;--fb:'DM Sans',sans-serif}
    body{background:var(--bg);color:var(--text);font-family:var(--fb);min-height:100vh;display:flex;flex-direction:column}
    nav{position:fixed;top:0;left:0;right:0;z-index:200;display:flex;align-items:center;justify-content:space-between;padding:1.2rem 5rem;background:rgba(10,10,10,0.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
    .nav-logo{font-family:var(--fh);font-size:1.6rem;color:var(--cream);text-decoration:none;letter-spacing:0.05em}
    .nav-logo span{color:var(--accent)}
    .nav-links{display:flex;gap:2.5rem;list-style:none;align-items:center}
    .nav-links a{color:var(--muted);text-decoration:none;font-size:0.88rem;font-weight:500;transition:color 0.2s}
    .nav-links a:hover{color:var(--text)}
    .nav-cta{background:var(--accent)!important;color:#fff!important;padding:0.55rem 1.5rem!important;border-radius:100px!important;font-weight:600!important}
    main{flex:1;display:flex;align-items:center;justify-content:center;padding:8rem 2rem 5rem;text-align:center;position:relative;overflow:hidden}
    main::before{content:'✓';position:absolute;font-family:var(--fh);font-size:clamp(15rem,40vw,40rem);color:transparent;-webkit-text-stroke:1px rgba(255,255,255,0.03);line-height:1;pointer-events:none}
    .inner{position:relative;z-index:1;max-width:560px}
    .check{width:72px;height:72px;background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.3);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2rem;margin:0 auto 2rem}
    h1{font-family:var(--fh);font-size:clamp(3rem,8vw,6rem);letter-spacing:0.02em;color:var(--cream);line-height:0.95;margin-bottom:1.2rem}
    h1 em{color:#22C55E;font-style:normal}
    p{font-size:0.97rem;color:var(--muted);line-height:1.75;font-weight:300;margin-bottom:2.5rem}
    .btn-fill{display:inline-flex;align-items:center;gap:0.5rem;background:var(--accent);color:#fff;padding:0.9rem 2rem;border-radius:100px;text-decoration:none;font-weight:600;font-size:0.9rem;transition:all 0.2s}
    .btn-fill:hover{background:var(--accent2);transform:translateY(-2px)}
    footer{background:var(--bg2);border-top:1px solid var(--border);padding:2.5rem 5rem;display:flex;align-items:center;justify-content:space-between}
    .footer-logo{font-family:var(--fh);font-size:1.4rem;letter-spacing:0.05em;color:var(--cream);text-decoration:none}
    .footer-logo span{color:var(--accent)}
    .footer-copy{font-size:0.8rem;color:var(--muted)}
    @media(max-width:960px){nav{padding:1rem 1.5rem}.nav-links{display:none}footer{flex-direction:column;gap:1.2rem;text-align:center;padding:2rem 1.5rem}}
  </style>
</head>
<body>
  <nav>
    <a href="index.html" class="nav-logo">TAKEY<span>.</span></a>
    <ul class="nav-links">
      <li><a href="index.html">About</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="blog.html">Blog</a></li>
      <li><a href="contact.html" class="nav-cta">Work With Me</a></li>
    </ul>
  </nav>

  <main>
    <div class="inner">
      <div class="check">✅</div>
      <h1>MESSAGE<br><em>RECEIVED</em></h1>
      <p>I'll review your situation and reply within 24 hours with honest, specific feedback. Check your inbox.</p>
      <a href="index.html" class="btn-fill">Back to Home ↗</a>
    </div>
  </main>

  <footer>
    <a href="index.html" class="footer-logo">TAKEY<span>.</span></a>
    <div class="footer-copy">© 2026 Takey Tahmid</div>
  </footer>
</body>
</html>
